<title>Talleres 39° Encuentro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: one-screen app — sticky search header with origin chip, LISTA | MAPA switch, taller cards or a street map; distances from the phone (or the school) */
:root{
  --bg:#f6f3f8; --surface:#ffffff; --fg:#1f1430; --muted:#6a5f78; --line:#e2dbea;
  --violet:#5b2a86; --violet-soft:#efe6f7; --green:#1f8a4c; --green-soft:#e2f3e8;
  --drum:#c2410c; --drum-soft:#fdeadf; --mapbg:#ece7f2; --ring:#c9bdd8;
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:12px; --me:#1a73e8; --tiles:none;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#150e1f; --surface:#211830; --fg:#f2ecf8; --muted:#b2a6c2; --line:#372b48;
  --violet:#c49bf0; --violet-soft:#33244a; --green:#5fd391; --green-soft:#183427;
  --drum:#fb8a4f; --drum-soft:#3d2216; --mapbg:#1b1428; --ring:#4a3b5e; --me:#6ea8ff; --tiles:invert(1) hue-rotate(180deg) brightness(.85) contrast(.9); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#150e1f; --surface:#211830; --fg:#f2ecf8; --muted:#b2a6c2; --line:#372b48;
  --violet:#c49bf0; --violet-soft:#33244a; --green:#5fd391; --green-soft:#183427;
  --drum:#fb8a4f; --drum-soft:#3d2216; --mapbg:#1b1428; --ring:#4a3b5e; --me:#6ea8ff; --tiles:invert(1) hue-rotate(180deg) brightness(.85) contrast(.9); color-scheme:dark}

[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--violet);outline-offset:2px}
a{color:inherit}

.app{height:100%;display:flex;flex-direction:column;max-width:760px;margin:0 auto}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding:12px 16px 10px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{font-family:var(--f-display);font-weight:900;font-size:1.9rem;line-height:.95;margin:0;letter-spacing:.01em;text-transform:uppercase;text-wrap:balance}
h1 small{display:block;font-size:.8rem;margin-top:3px;font-weight:700;letter-spacing:.06em;color:var(--muted)}
.zero{font-size:.78rem;color:var(--green);background:var(--green-soft);border-radius:999px;padding:4px 10px;white-space:nowrap;font-weight:700}
.searchrow{display:flex;gap:8px}
.search{flex:1;min-width:0;position:relative}
.search input{width:100%;height:46px;border:2px solid var(--line);background:var(--surface);border-radius:var(--r);padding:0 40px 0 14px;font-size:16px}
.search input:focus{border-color:var(--violet);outline:none}
.clear{position:absolute;right:6px;top:7px;width:32px;height:32px;border:0;background:none;color:var(--muted);font-size:1.3rem;cursor:pointer;border-radius:8px}
.fbtn{height:46px;padding:0 14px;border:2px solid var(--line);border-radius:var(--r);background:var(--surface);font-weight:700;cursor:pointer;white-space:nowrap}
.fbtn[aria-expanded="true"],.fbtn.on{border-color:var(--violet);color:var(--violet)}
.filters{display:grid;grid-template-columns:1fr;gap:8px}
.filters label{display:flex;flex-direction:column;gap:3px;font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.filters select{height:42px;border:2px solid var(--line);border-radius:10px;background:var(--surface);padding:0 10px;font-size:15px;text-transform:none;letter-spacing:0;font-weight:400;color:var(--fg);min-width:0;width:100%}
.ctrlrow{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--violet-soft);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:7px 18px;border-radius:999px;font-weight:700;letter-spacing:.08em;font-size:.85rem;cursor:pointer;color:var(--violet)}
.seg button[aria-pressed="true"]{background:var(--violet);color:var(--surface)}
.sort{display:flex;align-items:center;gap:6px;font-size:.85rem;color:var(--muted)}
.sort select{border:0;background:none;font-weight:700;color:var(--fg);font-size:.9rem;padding:4px 0;max-width:12rem}
.count{font-size:.85rem;color:var(--muted)}

main{flex:1;min-height:0;position:relative}
#listView{height:100%;overflow-y:auto;padding:12px 16px 32px;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch}

.pena{background:var(--drum-soft);border-radius:var(--r);padding:12px 14px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center}
.pena .ico{font-size:1.6rem;grid-row:span 2}
.pena b{font-family:var(--f-display);font-size:1.2rem;letter-spacing:.02em;text-transform:uppercase;color:var(--drum)}
.pena p{margin:0;font-size:.88rem}
.pena .acts{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}

.group{font-family:var(--f-display);font-weight:800;font-size:1rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:10px 2px 0;display:flex;justify-content:space-between;gap:12px}
.group span:last-child{color:var(--green);font-variant-numeric:tabular-nums;white-space:nowrap}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:6px}
.card h2{margin:0;font-size:1.06rem;line-height:1.3;font-weight:700;text-wrap:pretty}
.num{font-family:var(--f-display);font-weight:900;font-size:1.35rem;color:var(--violet);margin-right:2px;font-variant-numeric:tabular-nums}
.eje{font-size:.8rem;color:var(--muted);line-height:1.3}
.eje b{color:var(--violet);font-weight:700}
.tag{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;background:var(--violet-soft);color:var(--violet);border-radius:6px;padding:1px 6px;margin-left:4px;vertical-align:1px}
.sede{font-size:.92rem;margin-top:2px}
.sede strong{display:block}
.sede span{color:var(--muted)}
.dist{font-weight:700;font-size:1rem;color:var(--green);font-variant-numeric:tabular-nums;display:flex;gap:6px 14px;flex-wrap:wrap}
.approx{font-size:.78rem;color:var(--drum);font-weight:700}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 14px;border-radius:10px;font-weight:700;font-size:.9rem;text-decoration:none;cursor:pointer;border:2px solid var(--violet);background:none;color:var(--violet)}
.btn.primary{background:var(--violet);color:var(--surface)}
.btn.drum{border-color:var(--drum);color:var(--drum)}
.btn.wa{border-color:var(--green);color:var(--green)}
.btn.wa svg{width:18px;height:18px;fill:currentColor;flex:none}
.wa-mini{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;color:var(--green);background:var(--green-soft);vertical-align:middle;margin-left:6px;text-decoration:none}
.wa-mini svg{width:17px;height:17px;fill:currentColor}
.card.flash{border-color:var(--violet);box-shadow:0 0 0 3px var(--violet-soft)}
.empty{padding:30px 8px;text-align:center;color:var(--muted)}
.foot{font-size:.78rem;color:var(--muted);padding:16px 2px 0;line-height:1.5}
.credit{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:8px;padding:18px 12px;border-top:1px solid var(--line);font-size:.92rem;color:var(--muted);text-align:center}
.credit a{font-family:var(--f-display);font-weight:900;font-size:1.25rem;letter-spacing:.02em;color:var(--drum);text-decoration:none}
.credit a:hover{text-decoration:underline}
.legend .by a{color:var(--drum);font-weight:700;text-decoration:none}
mark{background:var(--violet-soft);color:inherit;border-radius:3px;padding:0 1px}

/* Map */
#mapView{position:absolute;inset:0;background:var(--mapbg);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#leafletMap{position:absolute;inset:0;background:var(--mapbg)}
.leaflet-tile-pane{filter:var(--tiles)}
.lf{border:0;background:none}
.lf.sede{border-radius:50%;background:var(--violet);color:var(--surface);font-family:var(--f-display);font-weight:900;font-size:1.05rem;box-shadow:0 0 0 3px var(--surface);display:flex!important;align-items:center;justify-content:center}
.lf.sede.dim{background:var(--ring);color:var(--muted);box-shadow:0 0 0 2px var(--surface);font-size:.8rem}
.lf.sede.sel{box-shadow:0 0 0 3px var(--surface),0 0 0 6px var(--violet)}
.lf.home,.lf.drumk{display:flex!important;align-items:center;justify-content:center;font-size:1.3rem;box-shadow:0 0 0 3px var(--surface)}
.lf.home{background:var(--green);border-radius:12px}
.lf.drumk{background:var(--drum);border-radius:50%}
.leaflet-tooltip.mlbl{font:700 .72rem var(--f-body);background:var(--surface);color:var(--fg);border:0;box-shadow:0 1px 4px rgba(0,0,0,.2);padding:2px 6px}
.leaflet-tooltip.mlbl:before{display:none}
.leaflet-tooltip.ringlbl{font:700 .7rem var(--f-body);background:none;border:0;box-shadow:none;color:var(--violet);padding:0}
.leaflet-tooltip.ringlbl:before{display:none}
.leaflet-container{font-family:var(--f-body)}
.mk{position:absolute;transform:translate(-50%,-50%);border:0;padding:0;cursor:pointer;background:none}
.mk.sede{width:34px;height:34px;border-radius:50%;background:var(--violet);color:var(--surface);font-family:var(--f-display);font-weight:900;font-size:1.05rem;box-shadow:0 0 0 3px var(--surface)}
.mk.sede.dim{background:var(--ring);color:var(--muted);box-shadow:0 0 0 2px var(--surface);width:24px;height:24px;font-size:.8rem}
.mk.sede.sel{box-shadow:0 0 0 3px var(--surface),0 0 0 6px var(--violet);z-index:3}
.mk.home,.mk.drumk{width:40px;height:40px;border-radius:12px;font-size:1.3rem;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 3px var(--surface);z-index:2}
.mk.home{background:var(--green)}
.mk.drumk{background:var(--drum);border-radius:50%}
.mlabel{position:absolute;transform:translate(-50%,0);font-size:.72rem;font-weight:700;white-space:nowrap;pointer-events:none;color:var(--fg);background:color-mix(in srgb,var(--surface) 85%,transparent);padding:1px 5px;border-radius:5px}
.mapctl{position:absolute;right:10px;top:96px;display:flex;flex-direction:column;gap:6px;z-index:1000}
.mapctl button{width:42px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:1.2rem;font-weight:700;cursor:pointer}
.legend{position:absolute;left:10px;top:10px;z-index:1000;background:color-mix(in srgb,var(--surface) 92%,transparent);border-radius:10px;padding:6px 9px;font-size:.7rem;display:flex;flex-direction:column;gap:2px;max-width:calc(100% - 84px)}
.sheet:not([hidden]) ~ .legend,.legend.hide{display:none}
.legend i{font-style:normal;color:var(--muted)}
.scale{position:absolute;left:12px;bottom:14px;z-index:5;font-size:.72rem;font-weight:700;color:var(--muted)}
.scale div{height:6px;border:2px solid var(--muted);border-top:0;margin-top:2px}

.sheet{position:absolute;left:0;right:0;bottom:0;z-index:1100;background:var(--surface);border-radius:18px 18px 0 0;box-shadow:0 -6px 24px rgba(20,10,30,.18);max-height:55%;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet .grab{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:14px 16px 8px}
.sheet h3{margin:0;font-family:var(--f-display);font-weight:800;font-size:1.45rem;line-height:1;text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
.sheet .x{border:0;background:var(--violet-soft);color:var(--violet);width:36px;height:36px;border-radius:50%;font-size:1.2rem;cursor:pointer;flex:none}
.sheet .body{overflow-y:auto;padding:0 16px 16px;display:flex;flex-direction:column;gap:8px}
.sheet .addr{color:var(--muted);font-size:.92rem}
.sheet .big{font-size:1.05rem;font-weight:700;color:var(--green);font-variant-numeric:tabular-nums;display:flex;flex-direction:column;gap:2px}
.sheet .n{font-family:var(--f-display);font-weight:800;font-size:1.05rem;letter-spacing:.04em;text-transform:uppercase;margin-top:4px}
.sheet ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.sheet li{padding:8px 0;border-top:1px solid var(--line);font-size:.95rem;line-height:1.3}
.sheet li.off{color:var(--muted);opacity:.6}
.sheet li .num{font-size:1.05rem}
@media (min-width:600px){ .filters{grid-template-columns:repeat(3,minmax(0,1fr))} h1{font-size:2.3rem} }
@media (prefers-reduced-motion:no-preference){ .sheet{animation:up .18s ease-out} @keyframes up{from{transform:translateY(20px);opacity:.6}} }

.originwrap{position:relative;flex:none}
.zero{border:0;cursor:pointer;font:inherit;font-size:.8rem}
.homelink{color:inherit;text-decoration:none;display:block}
.homelink:hover small{text-decoration:underline}
.ttl{display:flex;flex-direction:column;gap:4px;min-width:0}
.byline{font-size:.8rem;color:var(--drum);text-decoration:none;line-height:1.2}
.byline b{font-family:var(--f-display);font-weight:900;font-size:.98rem;letter-spacing:.03em;text-transform:uppercase}
.byline:hover b{text-decoration:underline}
.brand{align-items:flex-start}
.zero.warn{color:var(--drum);background:var(--drum-soft)}
.omenu{position:absolute;right:0;top:calc(100% + 6px);z-index:30;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(20,10,30,.18);padding:6px;display:flex;flex-direction:column;min-width:250px}
.omenu .olbl{font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 10px 4px}
.omenu button{border:0;background:none;text-align:left;padding:10px;border-radius:8px;cursor:pointer;font-weight:700;display:flex;flex-direction:column;gap:1px}
.omenu button small{font-weight:400;color:var(--muted);font-size:.78rem}
.omenu button[aria-checked="true"]{background:var(--violet-soft);color:var(--violet)}
.note{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;font-size:.9rem;line-height:1.45}
.note.strong{border-color:var(--violet);background:var(--violet-soft)}
.note .acts{margin-top:8px}
.linkbtn{border:0;background:none;padding:0;color:var(--violet);font-weight:700;text-decoration:underline;cursor:pointer;font-size:inherit;text-align:left}
.dist.off{font-weight:400}
.dist.big{flex-direction:column;gap:2px;font-size:1.05rem}
.pdist .dist{color:var(--drum)}
.pena .pdist,.pena .acts{grid-column:1/-1}
.pena .dist.off .linkbtn{color:var(--drum)}
.me{width:18px!important;height:18px!important;border-radius:50%;background:var(--me);box-shadow:0 0 0 3px #fff,0 0 8px rgba(0,0,0,.35)}
</style>
</head>
<body>


<div class="app">
<header>
  <div class="brand">
    <div class="ttl"><h1><a class="homelink" href="./" aria-label="Talleres 39° Encuentro, ir al inicio">Talleres<small>39° Encuentro · Córdoba</small></a></h1><a class="byline" href="https://www.instagram.com/bailalachola/" target="_blank" rel="noopener" data-ev="click_instagram" data-pos="header">🥁 Hecho por <b>Baila La Chola</b></a></div>
    <div class="originwrap"><button class="zero" id="originBtn" aria-haspopup="true" aria-expanded="false">📍 Activar ubicación</button>
      <div class="omenu" id="originMenu" hidden role="menu"><span class="olbl">Calcular distancias desde</span><button id="oGps" role="menuitemradio" aria-checked="true">📍 Mi ubicación <small>en tiempo real</small></button><button id="oEsc" role="menuitemradio" aria-checked="false">🏠 Escuela Esteban Echeverría <small>base de Baila La Chola</small></button></div></div>
  </div>
  <div class="searchrow">
    <div class="search">
      <input id="q" type="search" inputmode="search" autocomplete="off" placeholder="Buscá: número, tema, eje, sede…" aria-label="Buscar talleres">
      <button class="clear" id="qclear" aria-label="Borrar búsqueda" hidden>×</button>
    </div>
    <button class="fbtn" id="fbtn" aria-expanded="false" aria-controls="filters">Filtros</button>
  </div>
  <div class="filters" id="filters" hidden>
    <label for="fEje">Eje<select id="fEje"><option value="">Todos los ejes</option></select></label>
    <label for="fSede">Sede<select id="fSede"><option value="">Todas las sedes</option></select></label>
    <label for="fSub">Subcategoría (eje 10)<select id="fSub"><option value="">Todas</option></select></label>
  </div>
  <div class="ctrlrow">
    <div class="seg" role="group" aria-label="Vista">
      <button id="vList" aria-pressed="true">LISTA</button><button id="vMap" aria-pressed="false">MAPA</button>
    </div>
    <div class="sort" id="sortWrap"><label for="sort">Orden:</label>
      <select id="sort"><option value="cerca">Más cerca mío</option><option value="num">Por número</option><option value="eje">Por eje</option></select>
    </div>
    <span class="count" id="count" hidden></span>
  </div>
</header>
<main>
  <div id="listView"></div>
  <div id="mapView" hidden>
    <div id="leafletMap"></div>
    <div class="mapctl">
      <button id="zfit" aria-label="Ver todas las sedes" title="Ver todo">⤢</button><button id="zme" aria-label="Centrar en mi ubicación" title="Mi ubicación">📍</button>
    </div>
    <div class="sheet" id="sheet" hidden></div>
    <div class="legend"><span><b style="color:var(--me)">●</b> Vos</span><span>🏠 Escuela · base de Baila La Chola</span><span>🥁 Peña / Baila La Chola</span><span><b style="color:var(--violet)">●</b> Sede · número = talleres</span><i>Anillos: cada 1 km en línea recta desde el punto de partida.</i><span class="by">Hecho por <a href="https://www.instagram.com/bailalachola/" target="_blank" rel="noopener" data-ev="click_instagram">@bailalachola</a></span></div>
  </div>
</main>

  if(geo.status==="ok") return; // un error suelto con una posición ya conocida no cambia nada
  stopGeo();
  geo.status = err && err.code===1 ? "denied" : "unavailable";
  track("ubicacion",{estado: geo.status==="denied"?"denegada":"no_disponible"});
  updateOrigin();
}
// Recorrido peatonal real (OSRM · OpenStreetMap) desde la posición actual a los 23 puntos, con un pedido cada tanto
function maybeRoute(){
  if(mode!=="gps" || !geo.pos || routeBusy) return;
  if(hav(geo.pos, ESC) > 25000) return; // fuera de Córdoba: solo estimación
  if(routed && hav(routed.origin, geo.pos) < 150) return;
  if(routed && Date.now()-routed.at < 60000) return;
  routeBusy = true;
  const o = {lat:+geo.pos.lat.toFixed(4), lng:+geo.pos.lng.toFixed(4)};
  const coords = [o, ...PIDS.map(id=>POINTS[id])].map(p=>p.lng.toFixed(5)+","+p.lat.toFixed(5)).join(";");
  const ctl = new AbortController(); const to = setTimeout(()=>ctl.abort(), 8000);
  fetch("https://routing.openstreetmap.de/routed-foot/table/v1/foot/"+coords+"?sources=0&annotations=distance,duration", {signal:ctl.signal})
    .then(r=>r.ok?r.json():Promise.reject(r.status))
    .then(j=>{
      if(j.code!=="Ok") throw j.code;
      const d={}; PIDS.forEach((id,i)=>{ const m=j.distances[0][i+1], s=j.durations[0][i+1]; if(m!=null && s!=null) d[id]=[m,s]; });
      routed = {origin:o, at:Date.now(), d}; render();
    })
    .catch(()=>{ routed = routed ? {...routed, at:Date.now()} : {origin:{lat:0,lng:0}, at:Date.now(), d:{}}; })
    .finally(()=>{ clearTimeout(to); routeBusy=false; });
}
function setMode(m, reason){
  if(m===mode) return; mode=m;
  try{ localStorage.setItem("enc39origin", m); }catch(e){}
  track("cambiar_origen",{origen:m, motivo:reason||"menu"});
  if(m==="gps") startGeo(true);
  updateOrigin();
}

let st = {q:"", eje:"", sede:"", sub:"", sort:"cerca", view:"list", sel:null};

const isActive = () => !!(st.q||st.eje||st.sede||st.sub);
function filtered(){
  const toks = norm(st.q).trim().replace(/^#/,"").split(/\s+/).filter(Boolean);
  return talleres.filter(t=>{
    if(st.eje && t.eje!=+st.eje) return false;
    if(st.sede && t.sede!==st.sede) return false;
    if(st.sub && t.sub!==st.sub) return false;
    if(!toks.length) return true;
    if(toks.length===1 && /^\d+$/.test(toks[0])) return t.n===+toks[0];
    return toks.every(k=>t.hay.includes(k));
  });
}
function hl(text){
  const toks = norm(st.q).trim().replace(/^#/,"").split(/\s+/).filter(k=>k.length>1 && !/^\d+$/.test(k));
  if(!toks.length) return esc(text);
  const n = norm(text); let marks=[];
  toks.forEach(k=>{let i=0; while((i=n.indexOf(k,i))>-1){marks.push([i,i+k.length]); i+=k.length;}});
  marks.sort((a,b)=>a[0]-b[0]); let out="",p=0;
  marks.forEach(([a,b])=>{ if(a<p) return; out+=esc(text.slice(p,a))+"<mark>"+esc(text.slice(a,b))+"</mark>"; p=b; });
  return out+esc(text.slice(p));
}

const sedeName = id => id==="PENA" ? "Peña / Baila La Chola" : id==="ESC" ? "Escuela Esteban Echeverría" : (sedes[id]||{}).nombre;
document.addEventListener("click", e=>{
  const a=e.target.closest("[data-ev]"); if(!a) return;
  const p={origen:mode}; if(a.dataset.sede){ p.sede_id=a.dataset.sede; p.sede=sedeName(a.dataset.sede); }
  if(a.dataset.t){ const t=talleres[+a.dataset.t-1]; p.taller_n=+a.dataset.t; p.taller=t.nombre; p.eje=t.eje; }
  if(a.dataset.ev==="share"){ p.method="whatsapp"; p.content_type="taller"; p.item_id=String(a.dataset.t); }
  if(a.dataset.sede) p.distancia = distBucket(a.dataset.sede);
  p.seccion = navState().seccion; if(a.dataset.pos) p.posicion = a.dataset.pos;
  track(a.dataset.ev, p);
}, true);
let searchTimer=null;
$("q").addEventListener("input", e=>{ clearTimeout(searchTimer); const v=e.target.value.trim();
  if(v.length<2 && !/^\d+$/.test(v)) return;
  searchTimer=setTimeout(()=>track("search",{search_term:v.toLowerCase(), resultados:filtered().length}),1200); });
["fEje","fSede","fSub"].forEach(id=>$(id).addEventListener("change", e=>{ if(!e.target.value) return;
  const tipo={fEje:"eje",fSede:"sede",fSub:"subcategoria"}[id];
  track("filtro",{tipo, valor: id==="fSede"?sedeName(e.target.value):e.target.value}); }));
$("sort").addEventListener("change", e=>track("orden",{valor:e.target.value}));
$("vMap").addEventListener("click", ()=>track("ver_mapa"));
$("vList").addEventListener("click", ()=>track("ver_lista"));
listEl.addEventListener("click", e=>{ const b=e.target.closest("[data-map]"); if(b) track("ver_en_mapa",{sede_id:b.dataset.map, sede:sedeName(b.dataset.map)}); });

// ---- título: siempre vuelve al inicio (sin búsqueda, filtros ni link de taller)
document.querySelector(".homelink").addEventListener("click", e=>{
  e.preventDefault(); track("ir_a_inicio");
  setTimeout(()=>{ location.href = location.pathname; }, 120);
});

// ---- navegación con hash + páginas virtuales para Google Analytics
// #lista · #mapa · #sede-11 · #pena · #mapa-escuela · #t65 (taller) · #eje-5 · #escuela (abre con distancias desde la escuela)
const slug = s => norm(s).replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const sedeNum = id => +id.slice(1);
const BASE_PATH = location.pathname.replace(/index\.html$/,"").replace(/\/?$/,"/");
const ENTRY = (()=>{ const q=new URLSearchParams(location.search);
  return {src:q.get("utm_source")||"", hash:location.hash, ref:document.referrer}; })();
function distBucket(id){
  const d = dist(id); if(!d) return "sin_dato";
  const k=d.m/1000; return k<1?"0-1 km":k<2?"1-2 km":k<3?"2-3 km":k<5?"3-5 km":"5+ km";
}
function navState(){
  if(st.view==="map"){
    if(st.sel==="PENA") return {h:"pena", path:"mapa/pena", title:"Mapa · Peña Baila La Chola", seccion:"pena", sede:"Peña / Baila La Chola"};
    if(st.sel==="ESC") return {h:"mapa-escuela", path:"mapa/escuela", title:"Mapa · Escuela Esteban Echeverría", seccion:"escuela", sede:"Escuela Esteban Echeverría"};
    if(st.sel && sedes[st.sel]){ const s=sedes[st.sel];
      return {h:"sede-"+sedeNum(s.id), path:"mapa/sede/"+slug(s.nombre), title:"Sede · "+s.nombre, seccion:"sede", sede:s.nombre}; }
    return {h:"mapa", path:"mapa", title:"Mapa", seccion:"mapa"};
  }
  const q=st.q.trim().replace(/^#/,"");
  if(/^\d{1,2}$/.test(q) && +q>=1 && +q<=99 && !st.eje && !st.sede && !st.sub){ const t=talleres[+q-1];
    return {h:"t"+t.n, path:"taller/"+t.n+"-"+slug(t.nombre).slice(0,60), title:"Taller #"+t.n+" · "+t.nombre, seccion:"taller", taller_n:t.n, eje:t.eje, sede:t.s.nombre}; }
  if(st.eje && !st.q && !st.sede){ const e=ejes[+st.eje], sub=st.sub?"/"+slug(st.sub):"";
    return {h:"eje-"+e.id+(st.sub?"-"+slug(st.sub):""), path:"eje/"+e.id+"-"+slug(e.nombre).slice(0,50)+sub, title:"Eje "+e.id+" · "+e.nombre+(st.sub?" · "+st.sub:""), seccion:"eje", eje:e.id}; }
  return {h:"lista", path:"", title:"Lista de talleres", seccion:"lista"};
}
let navCur = null, navView = null, navSel = null, navPushAt = 0, navApplying = false, pvTimer = null, pvFirst = true, pvLast = "";
function syncNav(noPush){
  if(navApplying) return;
  const s = navState();
  if(s.h === navCur) return;
  const structural = navCur!==null && (navView!==st.view || navSel!==st.sel);
  const push = !noPush && structural && Date.now()-navPushAt > 400;
  try{ history[push?"pushState":"replaceState"](null, "", location.pathname+location.search+"#"+s.h); }catch(e){}
  if(push) navPushAt = Date.now();
  navCur = s.h; navView = st.view; navSel = st.sel;
  clearTimeout(pvTimer); pvTimer = setTimeout(()=>sendPageView(s), pvFirst ? 0 : 700);
}
function sendPageView(s){
  if(s.h === pvLast) return; pvLast = s.h;
  const p = {page_title:s.title, page_location:location.origin+BASE_PATH+s.path+(pvFirst?location.search:""), page_path:BASE_PATH+s.path,
    seccion:s.seccion, origen:mode};
  if(pvFirst && ENTRY.ref) p.page_referrer = ENTRY.ref;
  ["sede","eje","taller_n"].forEach(k=>{ if(s[k]!=null) p[k]=s[k]; });
  if(s.seccion==="sede"||s.seccion==="pena") p.distancia = distBucket(st.sel);
  if(s.seccion==="taller") p.distancia = distBucket(talleres[s.taller_n-1].sede);
  pvFirst = false;
  track("page_view", p);
}
function setUserProps(){
  try{ if(typeof gtag==="function") gtag("set","user_properties",{
    origen_distancias: mode,
    ubicacion: mode==="escuela" ? "no_usa" : geo.status,
    llegada: ENTRY.src ? ENTRY.src : (/^#t\d/.test(ENTRY.hash) ? "link_taller" : (ENTRY.ref ? "referido" : "directo"))
  }); }catch(e){}
}
function applyHash(hash, initial){
  navApplying = true;
  const h = (hash||"").replace(/^#/,"");
  let m, after = null;
  const resetFilters = () => { st.q=""; $("q").value=""; st.eje=""; st.sede=""; st.sub=""; $("fEje").value=""; $("fSede").value=""; $("fSub").value=""; };
  if(h==="escuela"){ if(mode!=="escuela"){ mode="escuela"; try{localStorage.setItem("enc39origin","escuela")}catch(e){} } resetFilters(); if(!sheet.hidden) closeSheet(); setView("list"); }
  else if((m=h.match(/^t(\d{1,2})$/)) && +m[1]>=1 && +m[1]<=99){ const n=+m[1];
    resetFilters(); st.q=String(n); $("q").value=st.q; if(!sheet.hidden) closeSheet(); setView("list");
    if(initial) track("abrir_link_compartido",{taller_n:n, taller:talleres[n-1].nombre, sede:talleres[n-1].s.nombre, eje:talleres[n-1].eje});
    after = () => { const el=$("t"+n); if(el){ el.classList.add("flash"); el.scrollIntoView({block:"center"}); } }; }
  else if((m=h.match(/^eje-(\d{1,2})(?:-(.+))?$/)) && ejes[+m[1]]){ resetFilters(); st.eje=m[1]; $("fEje").value=m[1];
    if(m[2]){ const sub=SUBS.find(x=>slug(x)===m[2]); if(sub){ st.sub=sub; $("fSub").value=sub; } }
    if(!sheet.hidden) closeSheet(); setView("list"); }
  else if((m=h.match(/^sede-(\d{1,2})$/)) && sedes["S"+String(+m[1]).padStart(2,"0")]){ const id="S"+String(+m[1]).padStart(2,"0");
    setView("map"); after = () => { openSheet(id); focusOn(id); }; }
  else if(h==="pena"){ setView("map"); after = () => { openSheet("PENA"); focusOn("PENA"); }; }
  else if(h==="mapa-escuela"){ setView("map"); after = () => { openSheet("ESC"); focusOn("ESC"); }; }
  else if(h==="mapa"){ if(!sheet.hidden) closeSheet(); setView("map"); }
  else if(h==="lista"){ if(!initial) resetFilters(); if(!sheet.hidden) closeSheet(); setView("list"); }
  else { setView(st.view); }
  const done = () => { navApplying = false; syncNav(true); };
  if(after) requestAnimationFrame(()=>{ after(); done(); }); else done();
}
window.addEventListener("popstate", ()=>applyHash(location.hash, false));

// ---- arranque (se lee el hash de entrada antes de dibujar, para no pisarlo)
const HASH0 = location.hash;
navApplying = true;
updateOrigin();
setUserProps();
applyHash(HASH0, true);
// Si el permiso ya estaba dado, arranca solo; si no, espera a que la persona toque "Usar mi ubicación"
if(mode==="gps"){
  if(navigator.permissions && navigator.permissions.query){
    navigator.permissions.query({name:"geolocation"}).then(r=>{
      if(r.state==="granted") startGeo(false);
      else if(r.state==="denied"){ geo.status="denied"; updateOrigin(); }
    }).catch(()=>{});
  }
}

</script>
